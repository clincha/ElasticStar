name: Run tests
permissions:
  contents: read
on:
  push:
    branches:
      - '*'
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run unit tests
        run: uv run pytest tests/ -v
