[project]
name = "elasticstar"
version = "0.1.0"
description = "Pulls Starling and Trading212 data into the finance spreadsheet"
requires-python = ">=3.14"
dependencies = [
    "gspread==6.2.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "tqdm==4.67.1",
    "trading212-api-py==0.1.9",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "requests-mock==1.12.1",
]

# Scripts at the repo root rather than an installable package, so there is
# nothing for uv to build.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
